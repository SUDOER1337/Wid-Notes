[package]
name = "nortex"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
] }
egui = "0.34"
pulldown-cmark = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "0.8", default-features = false, features = ["display", "parse"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }

# rfd on Linux needs a backend; on Windows it uses native dialogs
[target.'cfg(not(target_os = "windows"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", default-features = false }
